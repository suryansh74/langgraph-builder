[project]
name = "langgraph-builder-backend"
version = "0.1.0"
description = "LangGraph visual builder backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=0.2.34",
    "langchain>=0.3.4",
    "langchain-openai>=0.2.3",
    "pydantic>=2.9.2",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.2",
    "pytest>=8.3.3",
]

[tool.uv]
# Prefer pre-built wheels; avoid building from source on Python 3.14 when possible
package = false
